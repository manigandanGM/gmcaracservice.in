<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect | GM Car A/C Service</title>
    <style>
        :root {
            --primary-color: #007bff;
            /* GM Cool Blue */
            --bg-color: #f4f7f6;
            --text-color: #333;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 400px;
            /* Mobile width limit */
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            border-radius: 15px;
            margin: 20px;
        }

        .logo-area h1 {
            margin: 0;
            color: var(--primary-color);
            font-size: 24px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .logo-area p {
            color: #666;
            font-size: 14px;
            margin-top: 5px;
            margin-bottom: 30px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 15px 0;
            margin-bottom: 15px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-sizing: border-box;
            border: 2px solid transparent;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        /* Button Specific Styles */
        .btn-call {
            background-color: #2ecc71;
            color: white;
        }

        .btn-map {
            background-color: #3498db;
            color: white;
        }

        .btn-review {
            background-color: #f1c40f;
            color: #333;
        }

        .btn-insta {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            color: white;
        }

        .btn-fb {
            background-color: #1877f2;
            color: white;
        }

        .btn-web {
            background-color: white;
            border: 2px solid #333;
            color: #333;
        }

        .icon {
            margin-right: 10px;
            font-size: 18px;
        }

        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="logo-area">
            <h1>GM CAR A/C SERVICE</h1>
            <p>Keeping You Cool on the Road ❄️</p>
        </div>

        <a href="tel:+918428000085" class="btn btn-call">
            <span class="icon">📞</span> Call Us Now
        </a>

        <a href="https://www.google.com/maps/search/?api=1&query=GM+CAR+A/C+SERVICE+Ambattur+Chennai" target="_blank"
            class="btn btn-map">
            <span class="icon">📍</span> Navigate to Shop
        </a>

        <a href="https://g.page/r/CbJK9zlJN1rcEBE/review" target="_blank" class="btn btn-review">
            <span class="icon">⭐</span> Rate Us on Google
        </a>

        <a href="https://www.instagram.com/gmcaracservice/" target="_blank" class="btn btn-insta">
            <span class="icon">📸</span> Follow on Instagram
        </a>

        <a href="https://www.facebook.com/gmcaracservice/" target="_blank" class="btn btn-fb">
            <span class="icon">👍</span> Like us on Facebook
        </a>

        <a href="https://gmcaracservice.com" class="btn btn-web">
            <span class="icon">🌐</span> Visit Main Website
        </a>

        <div class="footer">
            GM Car A/C Service & Cool Sales<br>
            Ambattur, Chennai
        </div>
    </div>

</body>

</html>
